    <!-- Znacznik "JavaScript działa". Animacje wejścia ukrywają treść
         wyłącznie pod tą klasą, więc bez JS (robot, czytnik) strona

         zadziałał zanim przeglądarka namaluje pierwszą klatkę. -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!--
      Wybór motywu — musi zadziałać PRZED pierwszym malowaniem.

      Gdyby motyw ustawiał React, użytkownik z zapisanym motywem jasnym
      zobaczyłby najpierw czarny ekran, a po sekundzie biały. To mignięcie
      (FOUC) jest gorsze niż brak przełącznika, dlatego skrypt stoi tutaj,
      jest synchroniczny i nie zależy od niczego.

      DOMYŚLNA POLITYKA. Zmiana jednej wartości niżej zmienia zachowanie
      dla osób, które jeszcze nic nie wybrały:
        'light'  — zawsze jasny (ustawienie obecne)
        'dark'   — zawsze ciemny (oryginalny motyw marki)
        'system' — zgodnie z ustawieniem systemu odwiedzającego
    -->
    <script>
      (function () {
        var DEFAULT_POLICY = "light";
        var stored = null;
        try {
          stored = localStorage.getItem("zelak-theme");
        } catch (e) {
          /* tryb prywatny albo zablokowane dane witryny — lecimy dalej */
        }
        var policy =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : DEFAULT_POLICY;
        var resolved =
          policy === "system"
            ? window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : policy;
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.setAttribute("data-theme-policy", policy);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta)
          meta.setAttribute(
            "content",
            resolved === "light" ? "#FAFAF9" : "#000000",
          );
      })();
    </script>
